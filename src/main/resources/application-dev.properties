# H2 en memoria. Hibernate genera el esquema; Flyway apagado para iterar sin pelear
# con SQL de Postgres sobre H2 (ver config.md).
spring.datasource.url=jdbc:h2:mem:bodeguita;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.com.family.Bodeguita=debug
