spring.application.name=Bodeguita
spring.profiles.default=dev

# El open session in view esconde N+1 y deja el EntityManager abierto en la capa web.
spring.jpa.open-in-view=false

# dev corre sobre H2 y prod contra un Postgres externo: nadie necesita que el arranque
# levante compose.yaml, y si no hay docker instalado la app ni siquiera arranca.
spring.docker.compose.enabled=false

# Cuánto vive una invitación sin aceptar. Que caduquen es lo que evita que un email
# tecleado mal quede bloqueado para siempre.
bodeguita.invitation.ttl=P7D
